<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MergeFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-soft: #ccfbf1;
      --bg: #eef2f6;
      --surface: #fff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --open: #64748b;
      --l1: #0284c7;
      --l2: #7c3aed;
      --l3: #d97706;
      --approved: #0d9488;
      --merged: #059669;
      --danger: #e11d48;
      --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .06);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      background: #f7f8fa;
      color: var(--text);
      font-size: 14px;
    }
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 48px;
      padding: 0 16px;
      gap: 8px;
      display: flex;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0f766e, #4f46e5);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
    }
    .brand strong { font-weight: 700; letter-spacing: -.02em; }
    .brand .crumb { font-size: 12px; color: var(--muted); }
    .badge-pres {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--primary);
      background: var(--primary-soft);
      border: 1px solid #99f6e4;
      border-radius: 999px;
      padding: 4px 10px;
    }
    .gitlab-pill {
      font-size: 12px;
      font-weight: 600;
      color: #047857;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 999px;
      padding: 4px 10px;
    }
    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    .avatar, .av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0f172a;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      display: inline-grid;
      place-items: center;
      flex-shrink: 0;
    }
    .page { padding: 12px 16px 28px; max-width: 1440px; margin: 0 auto; }
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .page-head h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .page-head p { margin: 6px 0 0; color: var(--muted); }
    .toolbar {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .toggle {
      display: inline-flex;
      background: #fff;
      border-radius: 999px;
      padding: 4px;
      gap: 2px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(15,23,42,.04);
    }
    .toggle button {
      border: 0;
      background: transparent;
      padding: 7px 14px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      border-radius: 999px;
    }
    .toggle button:hover { color: var(--text); background: #f8fafc; }
    .toggle button.active {
      background: #0f172a;
      color: #fff;
    }
    .spacer { flex: 1; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: .15s ease;
    }
    .btn-primary {
      background: #0f172a;
      color: #fff;
    }
    .btn-primary:hover { background: #1e293b; }
    .btn-primary:disabled { opacity: .45; cursor: default; }
    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-danger {
      background: #fff;
      color: var(--danger);
      border: 1px solid #fecdd3;
    }
    .btn-danger:hover { background: #fff1f2; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-icon {
      width: 38px;
      height: 38px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }
    .btn-flat {
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 50%;
      font-size: 20px;
      line-height: 1;
    }
    .btn-flat:hover { background: #f1f5f9; color: var(--text); }
    .kpis {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi {
      background: #fff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: .15s ease;
    }
    .kpi:hover { transform: translateY(-1px); border-color: #cbd5e1; }
    .kpi.on {
      border-color: #0f172a;
      box-shadow: 0 0 0 3px rgba(15,23,42,.08);
    }
    .kpi .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
    .kpi .val { font-size: 26px; font-weight: 800; margin-top: 4px; letter-spacing: -.04em; }
    .kpi .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .card {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .table-top {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      gap: 12px;
    }
    .table-top h4 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .search { position: relative; }
    .search input {
      width: 260px;
      padding: 9px 36px 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      outline: none;
      background: #f8fafc;
    }
    .search input:focus {
      border-color: #99f6e4;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(15,118,110,.12);
    }
    .search svg {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .45;
    }
    .scroll { max-height: calc(100vh - 290px); overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
      white-space: nowrap;
    }
    thead th.right, tbody td.right { text-align: right; }
    thead th.center, tbody td.center { text-align: center; }
    thead th.sortable { cursor: pointer; user-select: none; }
    tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 13px;
      vertical-align: middle;
    }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fafc; }
    .mono {
      font-family: "IBM Plex Mono", Consolas, monospace;
      color: var(--primary);
      font-size: 12px;
      font-weight: 500;
    }
    .person {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .st {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 76px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .st-open { background: #f1f5f9; color: #475569; }
    .st-l1 { background: #e0f2fe; color: #0369a1; }
    .st-l2 { background: #ede9fe; color: #6d28d9; }
    .st-l3 { background: #ffedd5; color: #c2410c; }
    .st-approved { background: #ccfbf1; color: #0f766e; }
    .st-merged { background: #dcfce7; color: #15803d; }
    .empty { text-align: center; color: #94a3b8; padding: 40px; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      backdrop-filter: blur(6px);
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .overlay.open { display: flex; }
    .dialog {
      background: #fff;
      min-width: 72vw;
      max-width: 92vw;
      max-height: 88vh;
      overflow: auto;
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(15,23,42,.25);
    }
    .dialog.narrow { min-width: 560px; max-width: 680px; }
    .dialog-head {
      display: flex;
      align-items: center;
      padding: 18px 22px 8px;
      gap: 8px;
    }
    .dialog-head h6 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .dialog-body { padding: 8px 22px 22px; }
    .sub { color: var(--muted); margin: 0 0 14px; line-height: 1.5; }
    .meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .meta div {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .meta small { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .meta b { display: block; margin-top: 6px; font-weight: 650; }
    .suggest-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .suggest-box h3 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .suggest-box p { margin: 0 0 8px; line-height: 1.5; }
    .suggest-box p:last-child { margin-bottom: 0; }
    .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #99f6e4;
      box-shadow: 0 0 0 3px rgba(15,118,110,.12);
    }
    textarea { min-height: 64px; resize: vertical; }
    .fs {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #f7f8fa;
      display: none;
      flex-direction: column;
    }
    .fs.open { display: flex; }
    .fs-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .fs-bar h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
    .kpis-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      padding: 18px 28px 0;
    }
    .kpis-5 .kpi { cursor: default; }
    .kpis-5 .kpi:hover { transform: none; }
    .you-card {
      display: flex;
      align-items: center;
      gap: 24px;
      background: linear-gradient(135deg, #f0fdfa, #eef2ff);
      border: 1px solid #99f6e4;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .you-card .you-name { font-size: 16px; font-weight: 700; }
    .you-card .you-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .you-stats { display: flex; gap: 22px; margin-left: auto; }
    .you-stats div { text-align: center; }
    .you-stats .lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
    .you-stats .val { font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
    .lb-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 20px 24px;
      min-height: 0;
    }
    .panel {
      background: #fff;
      border-radius: 18px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 18px;
      overflow: auto;
    }
    .panel h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
    .rank-1 td { background: #ecfdf5; }
    .rank-2 td { background: #fffbeb; }
    .rank-3 td { background: #eef2ff; }
    tr.you-row td { box-shadow: inset 3px 0 0 var(--primary); font-weight: 650; }
    .bar {
      height: 6px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      width: 72px;
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
    }
    .bar > i { display: block; height: 100%; background: var(--primary); border-radius: inherit; }
    .charts { display: flex; flex-direction: column; gap: 28px; }
    .chart-block { display: flex; gap: 20px; align-items: center; }
    .pie { width: 168px; height: 168px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 10px #fff; }
    .legend { list-style: none; margin: 0; padding: 0; }
    .legend li { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
    .dot { width: 10px; height: 10px; border-radius: 99px; flex-shrink: 0; }
    .defs {
      background: #fff;
      margin: 0 28px 20px;
      padding: 16px 18px;
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }
    .defs strong { color: var(--text); font-weight: 700; }
    .section-title { margin: 16px 0 8px; font-size: 15px; font-weight: 700; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      display: none;
      z-index: 60;
      box-shadow: 0 12px 32px rgba(15,23,42,.28);
      font-weight: 500;
    }
    .toast.show { display: block; }
    .timeline { margin: 0; padding: 0; list-style: none; }
    .timeline li {
      display: grid;
      grid-template-columns: 12px 1fr;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eef2f6;
    }
    .timeline li:last-child { border-bottom: 0; }
    .timeline .dot-tl {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      margin-top: 5px;
      box-shadow: 0 0 0 4px #ccfbf1;
    }
    .timeline .dot-tl.off { background: #cbd5e1; box-shadow: none; }
    .timeline p { margin: 0; font-weight: 650; }
    .timeline span { font-size: 12px; color: var(--muted); }
    .split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
    .area-block {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 12px;
      margin-bottom: 0;
    }
    .area-block.empty-area { background: rgba(255,255,255,.7); }
    .area-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .area-head h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 8px; }
    .area-head .count { font-size: 13px; font-weight: 600; color: var(--muted); }
    .area-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .area-tag.ls { background: #ccfbf1; color: #0f766e; }
    .area-tag.lfm { background: #e0e7ff; color: #3730a3; }
    .area-tag.obm { background: #ffedd5; color: #c2410c; }
    .stages {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .stage {
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 10px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
    }
    .stage:hover { background: #fff; border-color: #cbd5e1; }
    .stage.on,
    .stage.on:hover {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }
    .stage .k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .stage .n { font-size: 20px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; margin-top: 2px; }
    .stage[data-st="open"] .n { color: var(--open); }
    .stage[data-st="l1"] .n { color: var(--l1); }
    .stage[data-st="l2"] .n { color: var(--l2); }
    .stage[data-st="l3"] .n { color: var(--l3); }
    .stage[data-st="approved"] .n { color: var(--approved); }
    .stage[data-st="merged"] .n { color: var(--merged); }
    .stage.on .k,
    .stage.on .n { color: #fff; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .mr-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      display: grid;
      gap: 6px;
      background: #fff;
    }
    .mr-card:hover { border-color: #0f172a; }
    .mr-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .mr-card h4 { margin: 0; font-size: 13px; font-weight: 650; line-height: 1.4; }
    .mr-card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
    .mr-card-foot { font-size: 11px; color: #94a3b8; }
    .quiet { color: #94a3b8; font-size: 13px; padding: 6px 2px 0; }
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      margin: 0 0 12px;
    }
    .tabs-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      margin: 0 0 12px;
    }
    .tabs-row .tabs { border-bottom: 0; margin: 0; }
    .tabs-row .btn-icon { margin: 0 0 6px auto; }
    .tabs button {
      border: 0;
      background: transparent;
      padding: 12px 22px;
      margin-bottom: -1px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tabs button:hover { color: var(--text); }
    .tabs button.active {
      color: #0f172a;
      border-bottom-color: #0f172a;
    }
    .filter-select select {
      min-width: 220px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 11px;
      font: inherit;
      background: #f8fafc;
    }
    .filter-select select:focus {
      outline: none;
      border-color: #99f6e4;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(15,118,110,.12);
    }
    .is-hidden { display: none !important; }
    .panel h3 span { color: var(--muted); font-weight: 600; }
    .map-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .map-col { display: grid; gap: 8px; align-content: start; }
    .map-col .person { font-size: 13px; }
    @media (max-width: 1100px) {
      .kpis, .kpis-5, .meta, .split, .lb-body, .form-grid, .stages, .cards { grid-template-columns: 1fr; }
      .dialog, .dialog.narrow { min-width: 0; width: 100%; }
      .page-head { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app-bar">
    <div class="brand">
      <span class="logo">M</span>
      <strong>MergeFlow</strong>
    </div>
    <div class="toggle" id="roleToggle"></div>
    <div class="spacer"></div>
    <button class="btn btn-outline" type="button" id="btnReviewers">Map</button>
    <button class="btn btn-outline" type="button" id="btnNotes">Notes</button>
    <button class="btn btn-outline" type="button" id="btnMe">Year-end</button>
    <div class="user-chip">
      <span class="avatar" id="userAv">RP</span>
      <span id="userName"></span>
    </div>

      { id: 7909, title: "Industry code mapping", author: "Priya Nair", reviewer: "Sneha Kulkarni", level: "L2", status: "merged", release: "release/2026.07", area: "OBM", created: "Apr 21, 2026, 2:44 PM", updated: "Jul 28, 2026, 4:19 PM", change: "Maps industry codes on the obligor record.", impact: "Industry is stored in one consistent code set." },
      { id: 7910, title: "Related party circular reference fix", author: "Amit Joshi", reviewer: "Sneha Kulkarni", level: "L2", status: "approved", release: "release/2026.10", area: "OBM", created: "Aug 4, 2026, 12:08 PM", updated: "Sep 20, 2026, 2:30 PM", change: "Stops circular related-party links.", impact: "Related party graphs no longer loop." }
    ];

    let selectedRelease = "release/2026.10";
    let selectedArea = "Loan Servicing";
    let selectedStatus = "open";
    let viewRole = "all";
    let currentUser = ME;
    let filter = "";
    let openMrId = null;
    let notesArea = "Loan Servicing";
    let mapArea = "Loan Servicing";

    function initials(name) {
      return String(name).split(" ").filter(Boolean).map((p) => p[0]).join("").slice(0, 2).toUpperCase();
    }
    function person(name) {
      if (!name) return "—";
      return `<span class="person"><span class="av">${initials(name)}</span>${name}</span>`;
    }
    function byRelease(rel) {
      return MRS.filter((m) => m.release === rel);
    }

    function counts(list) {
      const c = { open: 0, l1: 0, l2: 0, l3: 0, approved: 0, merged: 0 };
      list.forEach((m) => { c[m.status] += 1; });
      return c;
    }

    function personAreas(name) {
      return AREAS.filter((a) => {
        const map = REVIEWERS[a.id] || {};
        return ["L1", "L2", "L3"].some((lvl) => (map[lvl] || []).includes(name));
      });
    }

    function visibleAreas() {
      if (viewRole === "all") return AREAS.slice();
      return personAreas(currentUser);
    }

    function syncArea() {
      const areas = visibleAreas();
      if (!areas.length) return;
      if (!areas.some((a) => a.id === selectedArea)) selectedArea = areas[0].id;
    }

    function applyViewDefaults() {
      syncArea();
    }

    function renderViewAs() {
      document.getElementById("userAv").textContent = initials(currentUser);
      document.getElementById("userName").textContent = currentUser;
    }

    function renderToggles() {
      document.getElementById("roleToggle").innerHTML = VIEWS.map((v) =>
        `<button type="button" class="${v.id === viewRole ? "active" : ""}" data-role="${v.id}">${v.label}</button>`
      ).join("");
      const areas = visibleAreas();
      document.getElementById("areaTabs").classList.toggle("is-hidden", areas.length < 2);
      document.getElementById("areaTabs").innerHTML = areas.map((a) =>
        `<button type="button" class="${a.id === selectedArea ? "active" : ""}" data-area="${a.id}">${a.id}</button>`
      ).join("");
      document.getElementById("relToggle").innerHTML = RELEASES.map((r) =>
        `<button type="button" class="${r === selectedRelease ? "active" : ""}" data-rel="${r}">${r.replace("release/", "")}</button>`
      ).join("");
    }

    function stageTile(key, n) {
      return `<button class="stage ${selectedStatus === key ? "on" : ""}" type="button" data-st="${key}">
        <span class="k">${ST_LABEL[key]}</span>
        <span class="n">${n}</span>
      </button>`;
    }

    function mrCard(m) {
      return `<article class="mr-card" data-id="${m.id}">
        <div class="mr-card-top">
          <span class="mono">!${m.id}</span>
          <span class="st st-${m.status}">${ST_LABEL[m.status]}</span>
        </div>
        <h4>${m.title}</h4>
        <div class="mr-card-meta">
          <span>${m.author}</span>
          <span>${m.reviewer || "—"}</span>
        </div>
      </article>`;
    }

    function matchMr(m) {
      const q = filter.trim().toLowerCase();
      if (selectedStatus !== "all" && m.status !== selectedStatus) return false;
      if (!q) return true;
      return ["!" + m.id, m.title, m.author, m.reviewer, m.assignee, m.level, m.area, ST_LABEL[m.status]]
        .join(" ")
        .toLowerCase()
        .includes(q);
    }

    function renderAreaBlock(area) {
      const rel = byRelease(selectedRelease).filter((m) => m.area === area.id);
      const c = counts(rel);
      const cards = rel.filter(matchMr);
      return `<section class="area-block ${rel.length ? "" : "empty-area"}">
          <div class="stages">
            ${stageTile("open", c.open)}
            ${stageTile("l1", c.l1)}
            ${stageTile("l2", c.l2)}
            ${stageTile("l3", c.l3)}
            ${stageTile("approved", c.approved)}
            ${stageTile("merged", c.merged)}
          </div>
          ${cards.length ? `<div class="cards">${cards.map(mrCard).join("")}</div>` : `<p class="quiet">None</p>`}
        </section>`;
    }

    function renderTable() {
      const areas = visibleAreas();
      document.getElementById("empty").hidden = true;
      if (!areas.length) {
        document.getElementById("rows").innerHTML = `<section class="area-block empty-area"><p class="quiet">None</p></section>`;
        return;
      }
      const shown = [areas.find((a) => a.id === selectedArea) || areas[0]];
      document.getElementById("rows").innerHTML = shown.map(renderAreaBlock).join("");
    }

    function renderAll() {
      renderViewAs();
      renderToggles();
      renderTable();
    }

    function timeline(m) {
      const steps = [
        ["on", "Logged", m.created],
        [m.reviewer ? "on" : "off", m.reviewer ? `${m.level} · ${m.reviewer}` : "No approver", ""],
        [m.status === "open" ? "off" : "on", "In review", ""],
        [m.status === "approved" || m.status === "merged" ? "on" : "off", "Approved", ""],
        [m.status === "merged" ? "on" : "off", "Merged", ""]
      ];
      return `<ul class="timeline">${steps.map(([on, title, sub]) => `
        <li><span class="dot-tl ${on === "off" ? "off" : ""}"></span><div><p>${title}</p><span>${sub}</span></div></li>
      `).join("")}</ul>`;
    }

    function openDetail(id) {
      const m = MRS.find((x) => x.id === Number(id));
      if (!m) return;
      openMrId = m.id;
      document.getElementById("detailTitle").textContent = `!${m.id}  ${m.title}`;
      const canApprove = m.status !== "approved" && m.status !== "merged";
      document.getElementById("detailBody").innerHTML = `
        <p class="sub">${m.area} · ${m.release}</p>
        <div class="meta">
          <div><small>Author</small><b>${m.author}</b></div>
          <div><small>Approver</small><b>${m.reviewer || "—"}</b></div>
          <div><small>Status</small><b>${ST_LABEL[m.status]}</b></div>
          <div><small>Updated</small><b>${m.updated}</b></div>
        </div>
        <div class="split">
          <div>
            <div class="suggest-box">
              <h3>Change</h3>
              <p>${m.change}</p>
            </div>
            <div class="suggest-box">
              <h3>Impact</h3>
              <p>${m.impact}</p>
            </div>
            <div class="actions">
              <button class="btn btn-danger" type="button" id="btnChanges">Changes</button>
              <button class="btn btn-primary" type="button" id="btnApprove" ${canApprove ? "" : "disabled"}>${m.status === "merged" ? "Merged" : m.status === "approved" ? "Approved" : "Approve"}</button>
            </div>
          </div>
          <div class="suggest-box" style="margin:0">
            <h3>Timeline</h3>
            ${timeline(m)}
          </div>
        </div>
      `;
      document.getElementById("detailOverlay").classList.add("open");
      document.getElementById("btnApprove").addEventListener("click", () => {
        if (!canApprove) return;
        m.status = "approved";
        m.updated = "Sep 21, 2026, 11:08 PM";
        toast("Approved");
        openDetail(m.id);
        renderAll();
      });
      document.getElementById("btnChanges").addEventListener("click", () => {
        toast("Requested");
      });
    }

    function renderNotes() {
      if (!AREAS.some((a) => a.id === notesArea)) notesArea = selectedArea;
      document.getElementById("notesTitle").textContent = "Notes";
      document.getElementById("notesTabs").innerHTML = AREAS.map((a) =>
        `<button type="button" class="${a.id === notesArea ? "active" : ""}" data-area="${a.id}">${a.id}</button>`
      ).join("");
      const items = byRelease(selectedRelease).filter((m) =>
        m.area === notesArea && (m.status === "approved" || m.status === "merged")
      );
      document.getElementById("notesBody").innerHTML = items.length
        ? `<section class="area-block"><div class="cards">${items.map(mrCard).join("")}</div></section>`
        : `<section class="area-block empty-area"><p class="quiet">None</p></section>`;
    }

    function notesText() {
      const list = byRelease(selectedRelease).filter((m) =>
        m.area === notesArea && (m.status === "approved" || m.status === "merged")
      );
      return list.map((m) => `!${m.id} ${m.title}`).join("\n");
    }

    function renderMap() {
      if (!AREAS.some((a) => a.id === mapArea)) mapArea = selectedArea;
      document.getElementById("mapArea").innerHTML = AREAS.map((a) =>
        `<option value="${a.id}" ${a.id === mapArea ? "selected" : ""}>${a.id}</option>`
      ).join("");
      const map = REVIEWERS[mapArea] || {};
      const cols = ["L1", "L2", "L3"].map((lvl) => {
        const names = map[lvl] || [];
        return `<div class="map-col">
            <span class="st st-${lvl.toLowerCase()}">${lvl}</span>
            ${names.length ? names.map(person).join("") : `<p class="quiet">None</p>`}
          </div>`;
      });
      document.getElementById("mapRows").innerHTML =
        `<section class="area-block"><div class="map-cols">${cols.join("")}</div></section>`;
    }

    function fillReviewers() {
      const lvl = document.getElementById("logLevel").value;
      const area = document.getElementById("logArea").value;
      const names = (REVIEWERS[area] && REVIEWERS[area][lvl]) || [];
      const sel = document.getElementById("logReviewer");
      if (!names.length) {
        sel.innerHTML = `<option value="">None</option>`;
        return;
      }
      const preferred = names.includes("Himanshu Sharma") ? "Himanshu Sharma" : names[0];
      sel.innerHTML = names.map((n) =>
        `<option ${n === preferred ? "selected" : ""}>${n}</option>`
      ).join("");
    }

    function renderContribution() {
      const mine = MRS.filter((m) => m.author === currentUser);
      const reviewed = MRS.filter((m) => m.reviewer === currentUser);
      document.getElementById("kpiAuthored").textContent = String(mine.length);
      document.getElementById("kpiReviewed").textContent = String(reviewed.length);
      document.getElementById("authoredList").innerHTML = mine.length
        ? `<div class="cards" style="grid-template-columns:1fr">${mine.map(mrCard).join("")}</div>`
        : `<p class="quiet">None</p>`;
      document.getElementById("reviewedList").innerHTML = reviewed.length
        ? `<div class="cards" style="grid-template-columns:1fr">${reviewed.map(mrCard).join("")}</div>`
        : `<p class="quiet">None</p>`;
      const lines = [
        currentUser,
        "",
        "Raised",
        ...(mine.length ? mine.map((m) => `!${m.id} ${m.title}`) : ["None"]),
        "",
        "Reviewed",
        ...(reviewed.length ? reviewed.map((m) => `!${m.id} ${m.title}`) : ["None"])
      ];
      document.getElementById("yearCard").textContent = lines.join("\n");
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function closeOverlays() {
      ["detailOverlay", "notesOverlay", "mapOverlay", "logOverlay"].forEach((id) => {
        document.getElementById(id).classList.remove("open");
      });
      document.getElementById("contribution").classList.remove("open");
    }

    function copyText(text, ok) {
      navigator.clipboard.writeText(text).then(() => toast(ok)).catch(() => toast(ok));
    }

    document.getElementById("roleToggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-role]");
      if (!btn) return;
      viewRole = btn.getAttribute("data-role");
      applyViewDefaults();
      renderAll();
    });

    document.getElementById("areaTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-area]");
      if (!btn) return;
      selectedArea = btn.getAttribute("data-area");
      renderAll();
    });

    document.getElementById("relToggle").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-rel]");
      if (!btn) return;
      selectedRelease = btn.getAttribute("data-rel");
      renderAll();
    });

    document.getElementById("search").addEventListener("input", (e) => {
      filter = e.target.value;
      renderTable();
    });

    document.getElementById("rows").addEventListener("click", (e) => {
      const stage = e.target.closest("button[data-st]");
      if (stage) {
        const key = stage.getAttribute("data-st");
        selectedStatus = selectedStatus === key ? "open" : key;
        renderAll();
        return;
      }
      const card = e.target.closest("[data-id]");
      if (card) openDetail(card.getAttribute("data-id"));
    });

    document.getElementById("notesTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-area]");
      if (!btn) return;
      notesArea = btn.getAttribute("data-area");
      renderNotes();
    });
    document.getElementById("notesBody").addEventListener("click", (e) => {
      const card = e.target.closest(".mr-card[data-id]");
      if (!card) return;
      document.getElementById("notesOverlay").classList.remove("open");
      openDetail(card.getAttribute("data-id"));
    });

    document.getElementById("closeDetail").addEventListener("click", () => {
      document.getElementById("detailOverlay").classList.remove("open");
    });
    document.getElementById("detailOverlay").addEventListener("click", (e) => {
      if (e.target.id === "detailOverlay") e.currentTarget.classList.remove("open");
    });

    document.getElementById("btnNotes").addEventListener("click", () => {
      notesArea = selectedArea;
      renderNotes();
      document.getElementById("notesOverlay").classList.add("open");
    });
    document.getElementById("closeNotes").addEventListener("click", () => {
      document.getElementById("notesOverlay").classList.remove("open");
    });
    document.getElementById("notesOverlay").addEventListener("click", (e) => {
      if (e.target.id === "notesOverlay") e.currentTarget.classList.remove("open");
    });
    document.getElementById("copyNotes").addEventListener("click", () => {
      copyText(notesText(), "Copied");
    });

    document.getElementById("btnReviewers").addEventListener("click", () => {
      mapArea = selectedArea;
      renderMap();
      document.getElementById("mapOverlay").classList.add("open");
    });
    document.getElementById("mapArea").addEventListener("change", (e) => {
      mapArea = e.target.value;
      renderMap();
    });
    document.getElementById("closeMap").addEventListener("click", () => {
      document.getElementById("mapOverlay").classList.remove("open");
    });
    document.getElementById("mapOverlay").addEventListener("click", (e) => {
      if (e.target.id === "mapOverlay") e.currentTarget.classList.remove("open");
    });

    document.getElementById("btnMe").addEventListener("click", () => {
      renderContribution();
      document.getElementById("contribution").classList.add("open");
    });
    document.getElementById("closeMe").addEventListener("click", () => {
      document.getElementById("contribution").classList.remove("open");
    });
    document.getElementById("copyYear").addEventListener("click", () => {
      copyText(document.getElementById("yearCard").textContent, "Copied");
    });

    document.getElementById("contribution").addEventListener("click", (e) => {
      const card = e.target.closest(".mr-card[data-id]");
      if (!card) return;
      document.getElementById("contribution").classList.remove("open");
      openDetail(card.getAttribute("data-id"));
    });

    document.getElementById("btnLog").addEventListener("click", (e) => {
      document.getElementById("logArea").value = selectedArea;
      fillReviewers();
      document.getElementById("logOverlay").classList.add("open");
    });
    document.getElementById("logLevel").addEventListener("change", fillReviewers);
    document.getElementById("logArea").addEventListener("change", fillReviewers);
    document.getElementById("closeLog").addEventListener("click", () => {
      document.getElementById("logOverlay").classList.remove("open");
    });
    document.getElementById("cancelLog").addEventListener("click", () => {
      document.getElementById("logOverlay").classList.remove("open");
    });
    document.getElementById("logOverlay").addEventListener("click", (e) => {
      if (e.target.id === "logOverlay") e.currentTarget.classList.remove("open");
    });
    document.getElementById("submitLog").addEventListener("click", () => {
      const raw = document.getElementById("logId").value.replace("!", "").trim();
      const id = Number(raw) || 7860;
      const level = document.getElementById("logLevel").value;
      const reviewer = document.getElementById("logReviewer").value;
      const release = document.getElementById("logRelease").value;
      if (MRS.some((m) => m.id === id)) {
        toast("Already logged");
        return;
      }
      MRS.unshift({
        id,
        title: document.getElementById("logTitle").value,
        author: document.getElementById("logAuthor").value,
        reviewer,
        level,
        status: level.toLowerCase(),
        release,
        area: document.getElementById("logArea").value,
        created: "Sep 21, 2026, 11:08 PM",
        updated: "Sep 21, 2026, 11:08 PM",
        change: document.getElementById("logChange").value,
        impact: document.getElementById("logImpact").value
      });
      selectedRelease = release;
      selectedArea = document.getElementById("logArea").value;
      selectedStatus = level.toLowerCase();
      document.getElementById("logOverlay").classList.remove("open");
      renderAll();
      toast("Logged !" + id);
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeOverlays();
    });

    fillReviewers();
    renderAll();
  </script>
</body>
</html>
