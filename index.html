<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MergeFlow — Figma-style prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a1a1a;
      --teal: #0f6b63;
      --bg: #fff;
      --line: #d0d5dd;
      --text: #1a1a1a;
      --muted: #5f6b7a;
      --head: #f3f4f6;
      --amber: #9a6700;
      --red: #b42318;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background: #2b2b2b;
      overflow: hidden;
    }
    button, input, select, textarea { font-family: inherit; }
    .chrome {
      height: 40px; background: #1f1f1f; display: flex; align-items: center;
      justify-content: space-between; padding: 0 12px; color: #fff; border-bottom: 1px solid #000;
    }
    .chrome-left, .chrome-right, .chrome-center { display: flex; align-items: center; gap: 8px; }
    .figma-dots { display: flex; gap: 5px; }
    .figma-dots span { width: 8px; height: 8px; background: #666; }
    .figma-dots span:nth-child(1) { background: #ff5f57; }
    .figma-dots span:nth-child(2) { background: #febc2e; }
    .figma-dots span:nth-child(3) { background: #28c840; }
    .file-name { font-size: 12px; font-weight: 600; color: #e5e7eb; }
    .file-name small { color: #9ca3af; font-weight: 400; margin-left: 8px; }
    .mode-toggle { background: #111; border: 1px solid #444; display: flex; }
    .mode-toggle button {
      border: 0; background: transparent; color: #d1d5db; font-size: 11px; font-weight: 600;
      padding: 5px 10px; cursor: pointer;
    }
    .mode-toggle button.on { background: #fff; color: #111; }
    .present-btn {
      background: var(--navy); color: #fff; border: 1px solid #000;
      padding: 5px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .zoom { color: #9ca3af; font-size: 11px; }
    .canvas-wrap { height: calc(100% - 40px); overflow: auto; background:
      linear-gradient(#3a3a3a 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, #3a3a3a 1px, transparent 1px) 0 0 / 24px 24px #2b2b2b; }
    .canvas { min-width: 3200px; padding: 48px 56px 72px; display: flex; gap: 40px; align-items: flex-start; }
    .artboard { cursor: pointer; }
    .artboard-label { display: flex; align-items: center; gap: 8px; color: #d1d5db; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
    .artboard-label em { font-style: normal; color: #8b8b8b; font-weight: 400; }
    .device {
      width: 1280px; height: 800px; background: #f6f7fb; overflow: hidden;
      display: grid; grid-template-columns: 220px 1fr; border: 1px solid #111; border-radius: 12px;
    }
    .canvas .device { pointer-events: none; transform: scale(.72); transform-origin: top left; }
    .artboard .scaler { width: calc(1280px * .72); height: calc(800px * .72); }
    body.prototype-mode .canvas-wrap { overflow: hidden; }
    body.prototype-mode .canvas { min-width: 0; padding: 0; height: 100%; }
    body.prototype-mode .artboard { display: none; }
    body.prototype-mode .artboard.active { display: block; width: 100%; height: 100%; }
    body.prototype-mode .artboard-label { display: none; }
    body.prototype-mode .scaler, body.prototype-mode .device {
      width: 100%; height: 100%; transform: none; border: 0;
    }
    .sidebar { background: #0f172a; color: #fff; display: flex; flex-direction: column; }
    .brand { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: center; padding: 18px 16px 16px; }
    .logo { width: 32px; height: 32px; border-radius: 10px; background: #14b8a6; color: #042f2e; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
    .brand h1 { font-size: 15px; font-weight: 700; }
    .brand p { font-size: 11px; color: #94a3b8; }
    .nav-item { display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: center; margin: 2px 10px; padding: 9px 10px; border-radius: 10px; font-size: 13px; font-weight: 500; color: #cbd5e1; cursor: pointer; }
    .nav-item:hover { background: rgba(255,255,255,.06); }
    .nav-item.active { background: #14b8a6; color: #042f2e; }
    .nav-item svg { width: 16px; height: 16px; }
    .sidebar-foot { margin-top: auto; padding: 14px 16px; font-size: 11px; color: #94a3b8; line-height: 1.45; }
    .main { display: grid; grid-template-rows: 56px 1fr; min-width: 0; }
    .topbar { background: #fff; border-bottom: 1px solid #e8ecf2; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; }
    .search { max-width: 340px; flex: 1; background: #f6f7fb; border: 1px solid #e8ecf2; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
    .top-right { display: flex; align-items: center; gap: 10px; }
    .pill { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px; background: #ecfdf5; color: #047857; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: #0f172a; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
    .content { padding: 20px 22px 28px; overflow: auto; display: grid; align-content: start; gap: 16px; height: calc(800px - 56px); }
    body.prototype-mode .content { height: calc(100vh - 40px - 56px); }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .page-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
    .page-head p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .btn { border: 1px solid #e8ecf2; background: #fff; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #0f172a; color: #fff; border-color: #0f172a; }
    .btn-ghost { background: #fff; }
    .btn-danger { background: #fff; color: #b42318; border-color: #fecaca; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .release-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .release-tab {
      border: 1px solid #e8ecf2; background: #fff; border-radius: 999px; padding: 8px 14px;
      font-size: 13px; font-weight: 600; cursor: pointer; color: #475569;
    }
    .release-tab.on { background: #0f172a; color: #fff; border-color: #0f172a; }
    .area-block { background: #fff; border: 1px solid #e8ecf2; border-radius: 16px; padding: 16px; }
    .area-block.empty { background: #fafbfe; }
    .area-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .area-head h3 { font-size: 16px; font-weight: 700; }
    .area-head span { font-size: 12px; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .cards > .empty { grid-column: 1 / -1; }
    .stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .stage {
      border: 1px solid #e8ecf2; background: #f8fafc; border-radius: 14px; padding: 12px;
      text-align: left; cursor: pointer; min-height: 86px; display: grid; align-content: space-between;
    }
    .stage:hover { border-color: #cbd5e1; background: #fff; }
    .stage.on { background: #fff; border-color: #0f172a; box-shadow: 0 0 0 3px rgba(15,23,42,.08); }
    .stage .k { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
    .stage .n { font-size: 28px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
    .stage .s { font-size: 11px; color: #94a3b8; line-height: 1.25; }
    .stage.open .n { color: #475569; }
    .stage.l1 .n, .stage.l1 .k { color: #2563eb; }
    .stage.l2 .n, .stage.l2 .k { color: #4f46e5; }
    .stage.l3 .n, .stage.l3 .k { color: #0f172a; }
    .stage.approved .n, .stage.approved .k { color: #0f766e; }
    .stage.merged .n, .stage.merged .k { color: #15803d; }
    .mr-card {
      background: #fff; border: 1px solid #e8ecf2; border-radius: 14px; padding: 14px;
      cursor: pointer; display: grid; gap: 8px; min-height: 128px; align-content: start;
    }
    .mr-card:hover { border-color: #0f172a; }
    .mr-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .mr-card h4 { font-size: 13px; font-weight: 650; line-height: 1.35; }
    .mr-card-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #64748b; }
    .kpis, .contrib-kpis, .meta, .split, .grid-2, .form-grid { display: grid; gap: 12px; }
    .kpis { grid-template-columns: repeat(4, 1fr); }
    .contrib-kpis { grid-template-columns: 1fr 1fr; }
    .split, .grid-2 { grid-template-columns: 1.2fr .8fr; }
    .form-grid { grid-template-columns: 1fr 1fr; }
    .form-grid .full { grid-column: 1 / -1; }
    .kpi, .meta div, .card, .box, .share {
      background: #fff; border: 1px solid #e8ecf2; border-radius: 14px;
    }
    .kpi { padding: 14px; }
    .kpi .label { font-size: 11px; color: var(--muted); font-weight: 650; }
    .kpi .num { font-size: 28px; font-weight: 700; margin-top: 4px; }
    .kpi .hint, .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card { overflow: hidden; }
    .card h3 { font-size: 13px; font-weight: 700; padding: 12px 14px; border-bottom: 1px solid #eef2f6; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter { background: #fff; border: 1px solid #e8ecf2; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    .status, .lvl, .area { display: inline-flex; padding: 2px 8px; font-size: 11px; font-weight: 650; border-radius: 999px; white-space: nowrap; }
    .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #0f766e; }
    .st-open { background: #f1f5f9; color: #475569; }
    .st-pending { background: #fff7ed; color: #c2410c; }
    .st-approved { background: #ccfbf1; color: #0f766e; }
    .st-merged { background: #dcfce7; color: #15803d; }
    .l1 { background: #dbeafe; color: #1d4ed8; }
    .l2 { background: #e0e7ff; color: #4338ca; }
    .l3 { background: #e2e8f0; color: #0f172a; }
    .a-ls { background: #ccfbf1; color: #0f766e; }
    .meta { grid-template-columns: repeat(4, 1fr); }
    .meta div { padding: 12px; }
    .meta small { color: var(--muted); font-size: 11px; }
    .meta b { display: block; margin-top: 4px; font-size: 13px; }
    .field label { display: block; font-size: 11px; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
    .box { padding: 12px; font-size: 13px; line-height: 1.5; }
    .timeline { padding: 4px 0; }
    .step { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
    .dot { display: none; }
    .step p { font-weight: 650; }
    .step span { font-size: 12px; color: var(--muted); }
    .notes { padding: 8px 14px 14px; }
    .notes h4 { font-size: 12px; margin: 10px 0 6px; }
    .notes li { font-size: 13px; margin: 6px 0 6px 16px; line-height: 1.4; }
    .share { padding: 16px; font-size: 13px; line-height: 1.55; background: #0f172a; color: #fff; }
    .share h4 { font-size: 13px; margin-bottom: 8px; }
    .toast { position: fixed; bottom: 18px; right: 18px; background: #0f172a; color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none; z-index: 50; }
    .modal-back { display: none; position: absolute; inset: 0; background: rgba(15,23,42,.4); align-items: center; justify-content: center; z-index: 20; }
    .modal-back.on { display: flex; }
    .modal { width: 720px; max-height: 86%; overflow: auto; background: #fff; border-radius: 16px; padding: 18px; }
    .modal h3 { font-size: 18px; margin-bottom: 4px; }
    .form-grid { margin-top: 12px; }
    input, select, textarea { width: 100%; border: 1px solid #e8ecf2; border-radius: 10px; padding: 8px 10px; font-size: 13px; background: #fff; }
    textarea { min-height: 68px; resize: vertical; }
    .crumbs { font-size: 12px; color: var(--muted); }
    .crumbs b { color: var(--text); }
    .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .empty { padding: 18px 4px; font-size: 13px; color: var(--muted); }
    .rmap {
      display: grid; grid-template-columns: 1.15fr .95fr .75fr; gap: 0;
      background: #fff; border: 1px solid #e8ecf2; border-radius: 12px; overflow: hidden;
    }
    .rmap-col + .rmap-col { border-left: 1px solid #e8ecf2; }
    .rmap-col h3 {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      padding: 10px 12px; background: #f8fafc; border-bottom: 1px solid #e8ecf2; color: #64748b;
    }
    .rmap-col h3 b { color: #0f172a; font-size: 12px; letter-spacing: 0; text-transform: none; }
    .rmap-row {
      display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px;
      padding: 7px 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px;
    }
    .rmap-row:last-child { border-bottom: 0; }
    .rmap-av {
      width: 26px; height: 26px; border-radius: 50%; background: #eef2ff; color: #3730a3;
      font-size: 10px; font-weight: 700; display: grid; place-items: center;
    }
    .rmap-col.l1 .rmap-av { background: #eff6ff; color: #1d4ed8; }
    .rmap-col.l2 .rmap-av { background: #eef2ff; color: #4338ca; }
    .rmap-col.l3 .rmap-av { background: #f1f5f9; color: #0f172a; }
    .rmap-row span { color: #94a3b8; font-size: 11px; }
    .quiet { color: #94a3b8; font-size: 13px; padding: 8px 0 0; }
    .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .col { background: #fff; border: 1px solid #e8ecf2; border-radius: 12px; padding: 8px; min-height: 280px; }
    .col-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 6px 8px; }
    .col-h b { font-size: 12px; font-weight: 700; }
    .col-h span { font-size: 11px; color: #94a3b8; font-weight: 650; }
    .col.open b { color: #475569; }
    .col.l1 b { color: #2563eb; }
    .col.l2 b { color: #4f46e5; }
    .col.l3 b { color: #0f172a; }
    .col.approved b { color: #0f766e; }
    .col.merged b { color: #15803d; }
    .slim-card {
      background: #f8fafc; border: 1px solid #eef2f6; border-radius: 10px;
      padding: 8px 9px; margin-bottom: 6px; cursor: pointer; display: grid; gap: 4px;
    }
    .slim-card:hover { background: #fff; border-color: #cbd5e1; }
    .slim-card h4 { font-size: 12px; font-weight: 650; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .slim-card .who { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <header class="chrome">
    <div class="chrome-left">
      <div class="figma-dots"><span></span><span></span><span></span></div>
      <div class="file-name">MergeFlow <small>Argon hackathon · Loan Servicing data</small></div>
    </div>
    <div class="chrome-center">
      <div class="mode-toggle">
        <button id="btnCanvas" class="on" type="button">Canvas</button>
        <button id="btnProto" type="button">Prototype</button>
      </div>
    </div>
    <div class="chrome-right">
      <span class="zoom" id="zoomLabel">72%</span>
      <button class="present-btn" id="btnPresent" type="button">Present</button>
    </div>
  </header>

  <div class="canvas-wrap">
    <div class="canvas">
      <div class="artboard active" data-frame="dashboard">
        <div class="artboard-label">01 Dashboard <em>Manager · release → area → L1/L2</em></div>
        <div class="scaler"><div class="device" data-app></div></div>
      </div>
      <div class="artboard" data-frame="mrs">
        <div class="artboard-label">02 Merge Requests <em>Tracker</em></div>
        <div class="scaler"><div class="device" data-app></div></div>
      </div>
      <div class="artboard" data-frame="detail">
        <div class="artboard-label">03 MR detail <em>!7643 Himanshu Sharma</em></div>
        <div class="scaler"><div class="device" data-app></div></div>
      </div>
      <div class="artboard" data-frame="releases">
        <div class="artboard-label">04 Release <em>release/2026.10</em></div>
        <div class="scaler"><div class="device" data-app></div></div>
      </div>
      <div class="artboard" data-frame="contribution">
        <div class="artboard-label">05 My contribution <em>Rohit Patil</em></div>
        <div class="scaler"><div class="device" data-app></div></div>
      </div>
      <div class="artboard" data-frame="reviewers">
        <div class="artboard-label">06 Reviewer map <em>Loan Servicing</em></div>
        <div class="scaler"><div class="device" data-app></div></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const ME = "Rohit Patil";
    const OCT = "release/2026.10";
    const REVIEWERS = {
      L1: ["Rohit Patil", "Sunil Burud", "Kundan Bhadoriya", "Ankita Gade", "Uddeshya Kumar", "Ritika Saini"],
      L2: ["Himanshu Sharma", "Zainab"],
      L3: ["Mritunjay Sinha"]
    };
    const LEVEL = Object.fromEntries(
      Object.entries(REVIEWERS).flatMap(([lvl, names]) => names.map((n) => [n, lvl]))
    );
    const ST_LABEL = { open: "Open", pending: "Pending review", approved: "Approved", merged: "Merged" };
    const ST_CLASS = { open: "st-open", pending: "st-pending", approved: "st-approved", merged: "st-merged" };

    const RAW = [
      { id: 6630, title: "PIK Balloon Payment - Lender Breakdown Bug", author: "Uddeshya Kumar", created: "May 26, 2026, 3:01 PM", updated: "Sep 16, 2026, 6:31 PM", release: "release/2026.10", area: "Loan Servicing", assignee: "Zainab", resolved: true, change: "Fixes lender breakdown on PIK balloon payment.", impact: "Correct PIK balloon lender split in Loan Servicing." },
      { id: 7737, title: "LS-3025 Waterfall rounding issue", author: "Kundan Bhadoriya", created: "Sep 2, 2026, 11:40 AM", updated: "Sep 16, 2026, 4:27 PM", release: "release/2026.10", area: "Loan Servicing", assignee: "Kundan Bhadoriya", change: "October release fix for waterfall rounding (LS-3025).", impact: "Waterfall amounts round correctly." },
      { id: 7399, title: "Fx Rate Mandatory Check IPD Dashboard", author: "Sunil Burud", created: "Aug 5, 2026, 3:40 PM", updated: "Sep 15, 2026, 11:37 PM", release: "release/2026.10", area: "Loan Servicing", assignee: "Zainab", approvals: "1 of 2", change: "Makes FX rate mandatory on the IPD dashboard.", impact: "IPD cannot proceed without an FX rate." },
      { id: 7751, title: "LS-3505 Performance Optimizations: Fix N+1 Queries & Reduce DB Round-trips", author: "Rohit Patil", created: "Sep 3, 2026, 11:44 AM", updated: "Sep 15, 2026, 7:24 PM", release: "release/2026.07", area: "Loan Servicing", assignee: "Rohit Patil", reviewRequested: "Himanshu Sharma", resolved: true, change: "Fixes N+1 queries and reduces DB round-trips (LS-3505).", impact: "Lower DB load and faster Loan Servicing screens." },
      { id: 7801, title: "Loan Servicing : Adhoc Issues", author: "Rohit Patil", created: "Sep 9, 2026, 12:43 PM", updated: "Sep 15, 2026, 7:23 PM", release: "release/2026.10", area: "Loan Servicing", assignee: "Rohit Patil", change: "Adhoc Loan Servicing fixes for October.", impact: "Unblocks remaining October servicing issues." },
      { id: 7643, title: "LS-3373 JUnit Test Cases Enhancements", author: "Rohit Patil", created: "Aug 24, 2026, 11:45 AM", updated: "Sep 15, 2026, 7:14 PM", release: "release/2026.10", area: "Loan Servicing", assignee: "Rohit Patil", reviewRequested: "Himanshu Sharma", change: "Strengthens JUnit coverage for Loan Servicing (LS-3373).", impact: "Safer regression coverage before October merge." },
      { id: 7413, title: "LS-2115 Interpolation UI Validation", author: "Rohit Patil", created: "Aug 6, 2026, 5:19 PM", updated: "Sep 15, 2026, 7:12 PM", release: "release/2026.10", area: "Loan Servicing", assignee: "Rohit Patil", change: "Adds interpolation UI validation (LS-2115).", impact: "Invalid interpolation inputs are blocked in the UI." },
      { id: 7363, title: "Account owner change in bank account", author: "Ankita Gade", created: "Jul 31, 2026, 5:32 PM", updated: "Sep 15, 2026, 6:39 PM", release: "release/2026.10", area: "Loan Servicing", assignee: "Ankita Gade", change: "Supports account owner change on bank account.", impact: "Bank account owner can be updated without a workaround." },

      return `
        <aside class="sidebar">
          <div class="brand"><div class="logo">M</div><div><h1>MergeFlow</h1><p>Argon Project</p></div></div>
          ${nav.map(([id, label, ic]) => `<div class="nav-item ${id===page?"active":""}" data-go="${id}">${ic}${label}</div>`).join("")}
          <div class="nav-item" style="opacity:.55">${icon.set}Settings</div>
          <div class="sidebar-foot">GitLab remains the source of merge. Releases: release/2026.09, release/2026.10.</div>
        </aside>
        <section class="main">
          <div class="topbar">
            <div class="search">Search MRs, people, release/2026.10</div>
            <div class="top-right">
              <span class="pill">GitLab connected</span>
              <div class="avatar">RP</div>
              <span style="font-size:13px;font-weight:600">${ME}</span>
            </div>
          </div>
          <div class="content">${html}</div>
        </section>`;
    }

    function paint() {
      const p = pages();
      document.querySelectorAll(".artboard").forEach((board) => {
        board.querySelector("[data-app]").innerHTML = shell(board.dataset.frame, p[board.dataset.frame]);
      });
      bind();
    }

    function show(page) {
      document.querySelectorAll(".artboard").forEach((b) => b.classList.toggle("active", b.dataset.frame === page));
      paint();
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 1800);
    }

    function bind() {
      document.querySelectorAll("[data-go]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (el.dataset.mr) selectedId = Number(el.dataset.mr);
          document.body.classList.add("prototype-mode");
          setModeButtons(true);
          show(el.getAttribute("data-go"));
        });
      });
      document.querySelectorAll("[data-release]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedRelease = el.getAttribute("data-release");
          paint();
        });
      });
      document.querySelectorAll("[data-bucket]").forEach((el) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedBucket = el.getAttribute("data-bucket");
          paint();
        });
      });
      const openLog = document.getElementById("openLog");
      const logModal = document.getElementById("logModal");
      if (openLog && logModal) {
        openLog.addEventListener("click", (e) => { e.stopPropagation(); logModal.classList.add("on"); });
        document.getElementById("closeLog").addEventListener("click", () => logModal.classList.remove("on"));
        document.getElementById("submitLog").addEventListener("click", () => {
          logModal.classList.remove("on");
          toast("MR submitted for L2 review · Himanshu Sharma · release/2026.10");
        });
      }
      const approve = document.getElementById("approveBtn");
      if (approve) approve.addEventListener("click", () => toast("Approved in MergeFlow. Merge still happens in GitLab."));
      const copy = document.getElementById("copyYear");
      if (copy) copy.addEventListener("click", () => {
        navigator.clipboard.writeText(document.getElementById("yearCard").innerText).then(() => toast("Copied year-end summary"));
      });
      const copyNotes = document.getElementById("copyNotes");
      if (copyNotes) copyNotes.addEventListener("click", () => {
        navigator.clipboard.writeText(document.getElementById("notesCard").innerText).then(() => toast("Copied release/2026.10 notes"));
      });
    }

    function setModeButtons(proto) {
      document.getElementById("btnProto").classList.toggle("on", proto);
      document.getElementById("btnCanvas").classList.toggle("on", !proto);
      document.getElementById("zoomLabel").textContent = proto ? "100%" : "72%";
    }

    document.getElementById("btnCanvas").addEventListener("click", () => {
      document.body.classList.remove("prototype-mode");
      setModeButtons(false);
    });
    document.getElementById("btnProto").addEventListener("click", () => {
      document.body.classList.add("prototype-mode");
      setModeButtons(true);
    });
    document.getElementById("btnPresent").addEventListener("click", () => {
      document.body.classList.add("prototype-mode");
      setModeButtons(true);
      show("dashboard");
    });
    document.querySelectorAll(".artboard").forEach((b) => {
      b.addEventListener("click", () => {
        document.body.classList.add("prototype-mode");
        setModeButtons(true);
        show(b.dataset.frame);
      });
    });

    paint();
  </script>
</body>
</html>
